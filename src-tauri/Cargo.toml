[package]
name = "restnaa"
license = "MIT"
publish = false
default-run = "pausepal"
version = "0.1.3"
description = "An offline desktop companion for gentle breaks"
edition = "2021"
rust-version = "1.90"

# Keep the executable name for existing Windows installs and startup entries.
[[bin]]
name = "pausepal"
path = "src/main.rs"

[lib]
name = "restnaa_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
rusqlite = { version = "0.37", features = ["bundled"] }
thiserror = "2"
chrono = { version = "0.4", features = ["serde"] }
iana-time-zone = "0.1"
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
tauri-plugin-notification = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-autostart = "2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = ["UI_Notifications", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "3"
chrono-tz = "0.10"
